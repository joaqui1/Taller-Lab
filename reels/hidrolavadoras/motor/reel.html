<!doctype html>

<style>
@font-face { font-family: 'Plus Jakarta Sans'; src: url('fonts/PlusJakartaSans.ttf') format('truetype'); font-weight: 200 800; }

}
html, body { margin: 0; padding: 0; background: #000; }
body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

#photo img { position: absolute; left: 50%; top: 50%; width: 2880px; height: 1920px; margin: -960px 0 0 -1440px; object-fit: cover; filter: saturate(.85) brightness(.7); transform-origin: 50% 50%; }
#photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(32,39,43,.97) 0%, rgba(32,39,43,.86) 42%, rgba(32,39,43,.55) 70%, rgba(32,39,43,.92) 100%); }

.bignum .col.accent .num { color: var(--orange); }

.list { position: absolute; left: 80px; right: 80px; }
.list .row { display: flex; align-items: flex-start; gap: 30px; padding: 22px 0; border-bottom: 1px solid #3b4549; }
.list .n { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 30px; color: var(--orange); width: 64px; flex: 0 0 64px; padding-top: 12px; letter-spacing: .05em; }
.list .tx { font-size: 41px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
.list .tx small { display: block; font-size: 28px; font-weight: 500; color: var(--muted); margin-top: 6px; letter-spacing: 0; line-height: 1.28; }
.list .ck { flex: 0 0 64px; width: 64px; height: 64px; margin-left: auto; }
.list.no .ck path { stroke: #ff3b3b; }
.verdict { position: absolute; left: 80px; right: 80px; }
.verdict .line { font-weight: 800; font-size: 86px; letter-spacing: -.05em; line-height: 1.02; margin-bottom: 34px; padding-left: 36px; border-left: 12px solid var(--orange); }
.verdict .line.dim { color: var(--muted); font-weight: 600; font-size: 60px; border-left-color: #3b4549; }
.verdict .line .accent { color: var(--orange); }
.outro { position: absolute; inset: 0; }
.outro .logo { position: absolute; left: 50%; top: 700px; width: 720px; margin-left: -360px; }
.outro .cta { position: absolute; left: 80px; right: 80px; top: 960px; text-align: center; font-size: 46px; font-weight: 700; letter-spacing: -.02em; color: #d3d8d8; }
.outro .url { position: absolute; left: 80px; right: 80px; top: 1060px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; color: #fff; letter-spacing: .02em; }
.outro .url span { display: inline-block; background: var(--orange); color: #182023; padding: 22px 34px; border-radius: 5px; }
.outro .sticker { position: absolute; left: 50%; top: 1230px; transform: translateX(-50%) rotate(-3deg); font-family: 'Caveat', cursive; font-weight: 700; font-size: 60px; color: #ffd6c0; background: rgba(28,34,37,.9); border: 2px solid rgba(255,115,40,.7); padding: 18px 40px; border-radius: 6px; white-space: normal; max-width: 860px; text-align: center; line-height: 1.15; }
.sticker-float { position: absolute; font-family: 'Caveat', cursive; font-weight: 700; font-size: 58px; color: #ffd6c0; background: rgba(28,34,37,.92); border: 2px solid rgba(255,115,40,.7); padding: 14px 32px; border-radius: 6px; white-space: nowrap; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
.split { position: absolute; left: 80px; right: 80px; display: flex; gap: 30px; }
.split .col { flex: 1; background: var(--ink-2); border-radius: 6px; padding: 36px 34px 30px; border-top: 10px solid #2ecc71; }
.split .col.no { border-top-color: #ff3b3b; }
.split h3 { margin: 0 0 18px; font-size: 60px; font-weight: 800; letter-spacing: -.04em; color: #2ecc71; }
.split .col.no h3 { color: #ff3b3b; }
.split li { list-style: none; font-size: 34px; font-weight: 600; line-height: 1.25; padding: 16px 0; border-bottom: 1px solid #3b4549; letter-spacing: -.01em; }
.split ul { margin: 0; padding: 0; }
.bars { position: absolute; left: 80px; right: 80px; }
.bars .row { margin-bottom: 36px; }
.bars .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 36px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 12px; }
.bars .lab small { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--muted-2); font-weight: 600; letter-spacing: .06em; }
.bars .track { position: relative; height: 34px; background: #1a2023; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.bars .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #7f8a8e; border-radius: 3px; transform-origin: left; }
.bars .fill.b { background: var(--orange); }
.bars .val { position: absolute; right: 14px; top: 0; line-height: 34px; font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 800; color: #fff; }
.legend { position: absolute; left: 80px; right: 80px; display: flex; gap: 40px; font-family: 'JetBrains Mono', monospace; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.legend i { display: inline-block; width: 30px; height: 16px; vertical-align: middle; margin-right: 12px; background: #7f8a8e; border-radius: 2px; }
.legend i.b { background: var(--orange); }
canvas.fx { position: absolute; left: 0; top: 0; }
</style>

<body>
<div id="stage">
  <div id="cam">
    <div id="bg" class="layer"></div>
    <div id="photo" class="layer"><img src="../../../assets/editorial/hidrolavadoras.webp" alt=""></div>
    <div id="hatch" class="layer"></div>
    <div id="leak" class="abs"></div>
    <canvas id="fxback" class="fx" width="1080" height="1920"></canvas>
    <div id="content" class="layer"></div>
    <canvas id="fxfront" class="fx" width="1080" height="1920"></canvas>
    <div id="vignette" class="layer"></div>
  </div>
  <canvas id="grain" class="layer" width="270" height="480" style="width:1080px;height:1920px;"></canvas>
  <div id="flash" class="layer"></div>
  <div id="meta"><span>TallerLab <b>·</b> Hidrolavadoras</span><span id="metaR"></span></div>
  <div id="foot"><i></i>tallerlab.com.ar</div>
  <div id="progress"></div>
</div>
<script>
// ------------------------------------------------------------------
// Motor determinista: todo se calcula en función de t (segundos).
// ------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  outQuint: t => 1 - Math.pow(1 - t, 5),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  in: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
const ramp = (t, t0, t1, ease = E.out) => ease(clamp((t - t0) / Math.max(1e-6, t1 - t0), 0, 1));
// vida de un elemento: entrada / salida
const life = (t, tIn, tOut, dIn = .5, dOut = .35) => ({
  on: t >= tIn && t <= tOut + dOut,
  p: ramp(t, tIn, tIn + dIn, E.outQuint),
  q: ramp(t, tOut, tOut + dOut, E.in),
});
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = s => document.querySelector(s);
const content = $('#content');
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const fmt = n => n.toLocaleString('es-AR');
function fit(node, maxW) { // reduce font-size hasta que el contenido (no el bloque) entre
  const width = () => { const r = document.createRange(); r.selectNodeContents(node); return r.getBoundingClientRect().width; };
  let fs = parseFloat(getComputedStyle(node).fontSize);
  for (let i = 0; i < 40 && width() > maxW && fs > 30; i++) { fs -= 3; node.style.fontSize = fs + 'px'; }
}

const EVENTS = [];           // para el sound design: {t, type, ...}
const ev = (t, type, extra = {}) => EVENTS.push(Object.assign({ t: +t.toFixed(3), type }, extra));
const SHAKES = [];           // {t, amp}
const shake = (t, amp = 1) => SHAKES.push({ t, amp });
const FLASHES = [];          // {t, amp}
const flash = (t, amp = .35) => FLASHES.push({ t, amp });
const SCENES = [];           // {t0, t1} para el push-in de cámara
const PHOTO = [];            // {t0, t1} ventanas en las que se ve la foto editorial
const LAYERS = [];
const FX = [];               // dibujos en canvas: {t0, t1, draw(ctx, t, back)}

// ---------------- componentes ----------------
function hook({ t0, t1, kicker, lines, stagger = .42, spray = true, kickerDelay = 0 }) {
  const root = el('div', 'hook'); content.appendChild(root);
  const k = el('div', 'kicker', kicker); k.style.marginBottom = '34px'; root.appendChild(k);
  const words = []; let ti = t0 + .08;
  lines.forEach((ln, li) => {
    const line = el('div', 'line' + (ln.accent ? ' accent' : '') + (ln.small ? ' small' : ''));
    ln.text.split(' ').forEach((w, wi) => {
      const s = el('span', 'w', w); line.appendChild(s); line.appendChild(document.createTextNode(' '));
      words.push({ s, t: ti + wi * .09 });
    });
    root.appendChild(line); fit(line, 850);
    ev(ti, 'slam', { n: li, accent: !!ln.accent }); shake(ti, ln.accent ? 1.6 : 1.0); if (ln.accent) flash(ti, .3);
    ti += stagger + (ln.text.split(' ').length - 1) * .09;
  });
  const tEnd = ti;
  if (spray) { FX.push(sprayFX({ t0: t0 - .2, t1: t1 + .4, x: 1120, y: 1500, dir: -2.35, back: true })); ev(t0, 'spray', { dur: t1 - t0 + .3, mode: 'hook' }); }
  PHOTO.push({ t0, t1 });
  SCENES.push({ t0, t1 });
  LAYERS.push({ el: root, update(t) {
    const L = life(t, t0, t1, .5, .3); if (!L.on) return false;
    k.style.opacity = ramp(t, t0 + kickerDelay, t0 + kickerDelay + .35);
    k.style.transform = `translateY(${lerp(20, 0, ramp(t, t0 + kickerDelay, t0 + kickerDelay + .35))}px)`;
    words.forEach(w => {
      const p = ramp(t, w.t, w.t + .36, E.outQuint);
      w.s.style.opacity = p;
      w.s.style.transform = `translateY(${lerp(60, 0, p)}px) scale(${lerp(1.5, 1, p)})`;
      w.s.style.filter = `blur(${lerp(16, 0, p)}px)`;
    });
    const grow = 1 + 0.07 * ramp(t, t0, t1, E.lin);
    root.style.transformOrigin = '0 60%';
    root.style.opacity = 1 - L.q; root.style.transform = `translateY(${-80 * L.q}px) scale(${grow})`;
    return true;
  } });
  return tEnd;
}

function title({ t0, t1, top = 520, kicker, h, p }) {
  const root = el('div', 'title'); root.style.top = top + 'px'; content.appendChild(root);
  const k = el('div', 'kicker', kicker || ''); root.appendChild(k);
  const h2 = el('h2', '', h); h2.style.marginTop = '30px'; root.appendChild(h2);
  const pe = p ? el('p', '', p) : null; if (pe) root.appendChild(pe);
  ev(t0, 'whoosh'); SCENES.push({ t0, t1 });
  LAYERS.push({ el: root, update(t) {
    const L = life(t, t0, t1); if (!L.on) return false;
    const a = ramp(t, t0, t0 + .4), b = ramp(t, t0 + .12, t0 + .6, E.outQuint), c = ramp(t, t0 + .35, t0 + .8);
    k.style.opacity = a; k.style.transform = `translateX(${lerp(-30, 0, a)}px)`;
    h2.style.opacity = b; h2.style.transform = `translateY(${lerp(50, 0, b)}px)`; h2.style.filter = `blur(${lerp(10, 0, b)}px)`;
    if (pe) { pe.style.opacity = c; pe.style.transform = `translateY(${lerp(30, 0, c)}px)`; }
    root.style.opacity = 1 - L.q; root.style.transform = `translateY(${-60 * L.q}px)`;
    return true;
  } });
}

// Tarjeta de producto, estilo offer-card del sitio
function product({ t0, t1, top = 560, img, brand, model, code, chips, note, from = 'right' }) {
  const root = el('div', 'card'); root.style.top = top + 'px'; content.appendChild(root);
  const body = el('div', 'body'); root.appendChild(body);
  body.appendChild(el('div', 'brand', brand));
  body.appendChild(el('div', 'model', model));
  if (code) body.appendChild(el('div', 'code', code));
  const ch = el('div', 'chips'); body.appendChild(ch);
  const chipEls = chips.map((c, i) => { const e = el('div', 'chip' + (c.accent ? ' accent' : '') + (c.dim ? ' dim' : ''), c.t); ch.appendChild(e); return { e, t: t0 + .55 + i * .14 }; });
  const ph = el('div', 'ph'); const im = el('img'); im.src = 'recortes/' + img; ph.appendChild(im); body.appendChild(ph);
  const nt = note ? el('div', 'note', note) : null; if (nt) root.appendChild(nt);
  ev(t0, 'whoosh'); ev(t0 + .3, 'thud'); chipEls.forEach(c => ev(c.t, 'tick'));
  if (nt) ev(t0 + 1.1, 'pop');
  SCENES.push({ t0, t1 });
  LAYERS.push({ el: root, update(t) {
    const L = life(t, t0, t1, .6, .3); if (!L.on) return false;
    const p = ramp(t, t0, t0 + .6, E.outQuint);
    const dx = from === 'right' ? 1 : -1;
    root.style.transform = `translateX(${lerp(dx * 1100, 0, p)}px) translateY(${-50 * L.q}px) rotate(${lerp(dx * 3, 0, p)}deg)`;
    root.style.opacity = 1 - L.q;
    const f = ramp(t, t0 + .3, t0 + .9, E.outBack);
    im.style.transform = `translateY(${lerp(80, 0, f) + Math.sin((t - t0) * 1.6) * 6}px) scale(${lerp(.7, 1, f)})`; im.style.opacity = ramp(t, t0 + .3, t0 + .6);
    chipEls.forEach(c => { const q = ramp(t, c.t, c.t + .3, E.outBack); c.e.style.opacity = q; c.e.style.transform = `translateY(${lerp(18, 0, q)}px) scale(${lerp(.8, 1, q)})`; });
    if (nt) { const q = ramp(t, t0 + 1.1, t0 + 1.5); nt.style.opacity = q; nt.style.transform = `translateY(${lerp(20, 0, q)}px)`; }
    return true;
  } });
}

// Dos cifras grandes enfrentadas
function bignum({ t0, t1, top = 640, left, right, kicker, under }) {
  const wrap = el('div', 'abs'); wrap.style.cssText = `left:0;right:0;top:${top}px`; content.appendChild(wrap);
  const k = el('div', 'kicker', kicker || ''); k.style.cssText = 'position:absolute;left:80px;top:-80px'; wrap.appendChild(k);
  const root = el('div', 'bignum'); root.style.top = '0px'; wrap.appendChild(root);
  const mk = (d, cls) => { const c = el('div', 'col' + (d.accent ? ' accent' : '') + ' ' + cls); c.appendChild(el('div', 'lab', d.lab)); const n = el('div', 'num', ''); c.appendChild(n); c.appendChild(el('div', 'sub', d.sub || '')); root.appendChild(c); return { c, n, d }; };
  const A = mk(left, 'l'), B = mk(right, 'r');
  const un = under ? el('div', '', under) : null; if (un) { un.style.cssText = 'position:absolute;left:80px;right:80px;top:560px;font-size:40px;line-height:1.3;color:#d3d8d8;font-weight:500'; wrap.appendChild(un); }
  ev(t0, 'whoosh'); ev(t0 + .25, 'thud'); ev(t0 + .75, 'thud'); ev(t0 + .3, 'count', { dur: .9 }); if (un) ev(t0 + 1.4, 'pop');
  SCENES.push({ t0, t1 });
  LAYERS.push({ el: wrap, update(t) {
    const L = life(t, t0, t1, .6, .3); if (!L.on) return false;
    k.style.opacity = ramp(t, t0, t0 + .3);

function sprayFX({ t0, t1, x, y, dir, back = false, n = 420, spread = .26, speed = 1500, life: lf = 1.1, color = '207,232,255' }) {
  const rnd = mulberry32(1234 + Math.round(x + y));
  const P = Array.from({ length: n }, (_, i) => ({ b: rnd() * lf, a: dir + (rnd() - .5) * spread, v: speed * (.6 + rnd() * .7), s: 2 + rnd() * 5, g: 900 + rnd() * 800, o: .4 + rnd() * .6 }));
  return { t0, t1, back, draw(ctx, t) {
    const fade = ramp(t, t0, t0 + .4) * (1 - ramp(t, t1 - .4, t1, E.in));
    if (fade <= 0) return;
    const T = t - t0;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    // cono de luz
    const g = ctx.createRadialGradient(x, y, 0, x, y, 1500); g.addColorStop(0, `rgba(${color},${.10 * fade})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, 1500, dir - spread * 1.1, dir + spread * 1.1); ctx.closePath(); ctx.fill();
    for (const p of P) {
      const age = ((T + p.b) % lf); const k = age / lf;
      const px = x + Math.cos(p.a) * p.v * age, py = y + Math.sin(p.a) * p.v * age + .5 * p.g * age * age;
      if (px < -50 || px > 1130 || py < -50 || py > 1970) continue;
      const al = p.o * (1 - k) * fade * .9;
      ctx.fillStyle = `rgba(${color},${al})`;
      ctx.beginPath(); ctx.ellipse(px, py, p.s * (1 + k), p.s * .6, p.a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  } };
}

function gaugeFX({ t0, t1, cx = 540, cy = 1000, r = 330, max = 200, keys, labels }) {

    // arco de valor

    ctx.fillStyle = '#ff5a0a'; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#20272b'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();

// Chorro concentrado vs abanico (reel 2): dos boquillas sobre una superficie
function nozzleFX({ t0, t1, mode }) {

  let po = 0; for (const w of PHOTO) { if (t >= w.t0 - .1 && t <= w.t1 + .4) po = Math.max(po, ramp(t, w.t0 - .1, w.t0 + .6) * (1 - ramp(t, w.t1, w.t1 + .4, E.in))); }
