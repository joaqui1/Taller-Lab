<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reel 06 · Estación portátil</title><link rel="stylesheet" href="base.css">
<style>
.two{position:absolute;left:72px;top:760px;width:936px;display:flex;gap:24px;perspective:1600px}
.two .card{position:relative;flex:1;border-top-width:6px}
.two .card .body{padding:30px 28px 30px}
.two .card .brand{position:static;display:block;font-family:var(--mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#b84004;font-weight:600}
.two .card .name{font-weight:800;font-size:36px;letter-spacing:-.03em;margin:8px 0 18px}
.two .card .row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:23px;color:#626a6c;padding:11px 0;border-top:1px solid var(--border)}
.two .card .row b{font-size:38px;color:var(--ink);font-weight:600;letter-spacing:-.03em}
.two .card .row b.o{color:#d54b00}
.two .card .row small{font-size:21px;margin-left:4px}
.batt{position:absolute;left:72px;top:700px;width:936px;height:300px}
.batt .shell{position:absolute;left:0;top:40px;width:900px;height:220px;border:6px solid #cfd6d7;border-radius:30px;padding:14px}
.batt .cap{position:absolute;left:906px;top:110px;width:30px;height:80px;background:#cfd6d7;border-radius:0 10px 10px 0}
.batt .fill{height:100%;width:100%;border-radius:16px;background:linear-gradient(90deg,#ff874b,#ff5a0a);box-shadow:0 0 50px rgba(255,90,10,.55);transform-origin:left;transform:scaleX(0)}
.batt .lab{position:absolute;left:0;right:0;top:40px;height:220px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:92px;letter-spacing:-.04em;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.batt .lab small{font-size:40px;margin-left:12px;letter-spacing:0}
.eq{position:absolute;left:72px;width:936px;display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.eq .box{font-family:var(--mono);font-weight:600;font-size:40px;color:#fff;background:#252d30;border:2px solid #3b464a;border-radius:10px;padding:22px 26px;will-change:transform,opacity}
.eq .box.o{border-color:var(--orange);background:rgba(255,90,10,.14)}
.eq .op{font-size:60px;font-weight:800;color:var(--orange)}
</style></head>
<body><div id="stage"></div>
<script src="engine.js"></script>
<script>
R.dur = 17; R.title = 'Batería o generador';
R.music = { bpm: 98, root: 'C', mode: 'minor', sections: [[0, 3.4, 'hook'], [3.4, 8.6, 'build'], [8.6, 14.1, 'full'], [14.1, 17, 'outro']] };
chrome({ tag: 'Energía portátil', foot: 'Manuales UE', lightAt: t => t >= 8.6 && t < 11.6 });

/* S1 · HOOK */
scene({ t0: 0, t1: 3.4,
  build(r) {
    const c = el('div', 'col', null, r); c.style.top = '430px';
    const k = el('div', 'kicker', '', c); k.style.marginBottom = '36px';
    const h = el('div', 'hook', null, c); h.style.fontSize = '150px';
    const ws = buildWords(h, [['Sin motor.'], ['Sin nafta.'], [{ w: '¿Alcanza?', o: true }]]);
    const stk = el('div', 'sticker', 'estación de energía vs. generador', r); stk.style.cssText += 'left:72px;top:1050px;transform-origin:left center';
    const p = el('p', 'sub', 'Una estación guarda electricidad en una batería. Para elegirla hay que separar <b>dos límites</b>.', c); p.style.marginTop = '230px';
    R.ev(0, 'impact', { gain: .9 }); R.ev(0.02, 'typing', { n: 16 }); R.ev(.55, 'impact', { gain: .7, hi: true }); R.ev(1.0, 'impact', { gain: .7, hi: true }); R.ev(1.3, 'riser', { len: .3 }); R.ev(1.6, 'impact', { gain: 1.2 });
    R.ev(2.15, 'pop'); R.ev(2.5, 'whoosh', { len: .3, soft: true });
    return { k, ws, stk, p };
  },
  frame(t, T, s) {
    typeText(s.k, 'Energía portátil', t, .02, 34);
    wordsAnim(s.ws.slice(0, 2), t, .15, .45, .7, 'rise'); wordsAnim([s.ws[2]], t, 1.6, 0, .6, 'slam');
    const sh = t >= 1.6 ? Math.max(0, 1 - (t - 1.6) / .3) : 0; st(q('#stage'), { x: Math.sin(t * 95) * 14 * sh, y: Math.cos(t * 72) * 10 * sh, s: 1 + .02 * sh });
    const v = tw(t, 2.15, .6, 'outBack'); st(s.stk, { o: v, r: L(8, -4, v), s: L(.7, 1, v) });
    enter(s.p, t, 2.5, .8, { from: { y: 40, o: 0 } });
  }
});
addWipe(3.25, .5);

/* S2 · W vs Wh */
scene({ t0: 3.4, t1: 8.6,
  build(r) {
    const c = el('div', 'col', null, r); c.style.top = '360px';
    const k = el('div', 'kicker', '', c); k.style.marginBottom = '34px';
    const h = el('div', 'hook', null, c); h.style.fontSize = '150px';
    const ws = buildWords(h, [[{ w: 'W', o: true }, '≠', { w: 'Wh', o: true }]]);
    const sub = el('p', 'sub', '<b>W</b> es cuánta potencia entrega a la vez. <b>Wh</b> es cuánta energía guarda.', c); sub.style.marginTop = '24px';
    const b = el('div', 'batt', '<div class="shell"><div class="fill"></div></div><div class="cap"></div><div class="lab"><span class="cnt">0</span><small>Wh</small></div>', r); b.style.top = '820px';
    const two = el('div', 'two', null, r); two.style.top = '1170px';
    const mk = (brand, name, wh, w, pk, kg) => el('div', 'card', `<div class="body"><span class="brand">${brand}</span><div class="name">${name}</div>
      <div class="row"><span>Capacidad</span><span><b class="o">${wh}</b><small>Wh</small></span></div>
      <div class="row"><span>CA continua</span><span><b>${w}</b><small>W</small></span></div>
      <div class="row"><span>Pico</span><span><b style="font-size:30px">${pk}</b><small>W</small></span></div>
      <div class="row"><span>Peso</span><span><b style="font-size:30px">${kg}</b><small>kg</small></span></div></div>`, two);
    const c1 = mk('EcoFlow · manual UE', 'DELTA 2', '1.024', '1.800', '2.700', '12');
    const c2 = mk('BLUETTI · manual UE', 'AC70', '768', '1.000', '1.500', '10,2');
    R.ev(3.45, 'typing', { n: 14 }); R.ev(3.7, 'impact', { gain: .9 }); R.ev(3.95, 'impact', { gain: .5, hi: true }); R.ev(4.2, 'impact', { gain: .9 });
    R.ev(4.9, 'hum', { len: 1.6 }); R.ev(4.9, 'ticks', { len: 1.2, rate: 26 }); R.ev(6.1, 'blip', { up: true }); R.ev(6.5, 'whoosh', { len: .4, soft: true }); R.ev(6.75, 'whoosh', { len: .4, soft: true }); R.ev(7.4, 'pop');
    return { k, ws, sub, b, c1, c2 };
  },
  frame(t, T, s) {
    typeText(s.k, 'Dos límites', t, .05, 36);
    wordsAnim([s.ws[0]], t, .3, 0, .55, 'slam'); wordsAnim([s.ws[1]], t, .55, 0, .5, 'rise'); wordsAnim([s.ws[2]], t, .8, 0, .55, 'slam');
    enter(s.sub, t, 1.0, .9, { from: { y: 40, o: 0 } });
    enter(s.b, t, 1.3, .9, { from: { y: 60, o: 0 } });
    const u = tw(t, 1.5, 1.2, 'outCubic'); q('.fill', s.b).style.transform = `scaleX(${u})`; counter(q('.cnt', s.b), t, 1.5, 1.2, 0, 1024);
    enter(s.c1, t, 3.1, .9, { from: { x: -160, o: 0, ry: 30 } }); enter(s.c2, t, 3.35, .9, { from: { x: 160, o: 0, ry: -30 } });
  }
});
addWipe(8.45, .5, 'cream');

/* S3 · AUTONOMÍA (crema) */
scene({ t0: 8.6, t1: 11.6,
  build(r) {
    const c = el('div', 'col', null, r); c.style.top = '360px';
    const k = el('div', 'kicker', '', c); k.style.marginBottom = '34px';
    const h = el('div', 'hook', null, c); h.style.fontSize = '112px';
    const ws = buildWords(h, [['1.024 Wh'], ['no son 1.024', { w: 'útiles.', o: true }]]);
    const list = el('div', '', null, r); list.style.cssText = 'position:absolute;left:72px;top:800px;display:flex;flex-direction:column;gap:26px';
    const items = [['Energía reservada', 'profundidad de descarga ≈ 90 %'], ['Pérdidas del inversor', 'eficiencia típica > 85 %'], ['Consumo propio', '≈ 15 W en cargas pequeñas']]
      .map(([a, b]) => el('div', 'check', `<span class="ic">${ICON.check}</span><span>${a}<small>${b}</small></span>`, list));
    const card = el('div', 'card', `<div style="padding:34px 40px"><div class="cap">Ejemplo del manual BLUETTI AC70</div><div class="desc" style="margin-top:12px;font-size:30px">768 Wh × 0,9 × 0,85 ÷ (40 W + 15 W)</div><div class="big" style="margin-top:12px">≈ <span class="cnt">0,0</span><small>horas</small></div></div>`, r); card.style.cssText += 'left:72px;width:936px;top:1180px';
    R.ev(8.65, 'typing', { n: 12 }); R.ev(8.95, 'impact', { gain: .6, hi: true }); R.ev(9.3, 'impact', { gain: .5, hi: true }); R.ev(9.55, 'impact', { gain: .9 });
    [9.9, 10.15, 10.4].forEach(x => R.ev(x, 'blip', { up: true })); R.ev(10.7, 'ticks', { len: .7, rate: 24 }); R.ev(11.35, 'pop');
    return { k, ws, items, card };
  },
  frame(t, T, s) {
    typeText(s.k, 'Autonomía real', t, .05, 36);
    wordsAnim([s.ws[0]], t, .3, 0, .7, 'rise'); wordsAnim([s.ws[1]], t, .6, 0, .7, 'rise'); wordsAnim([s.ws[2]], t, .95, 0, .55, 'slam');
    s.items.forEach((it, i) => enter(it, t, 1.3 + i * .25, .7, { from: { x: 60, o: 0 } }));
    enter(s.card, t, 2.0, .9, { from: { y: 80, o: 0, rx: 10 } }); counter(q('.cnt', s.card), t, 2.1, .7, 0, 10.7, fmtDec(1));
  }
});
addWipe(11.45, .5, 'dark');

/* S4 · ANTES DE COMPRAR */
scene({ t0: 11.6, t1: 14.1,
  build(r) {
    const c = el('div', 'col', null, r); c.style.top = '360px';
    const k = el('div', 'kicker', '', c); k.style.marginBottom = '34px';
    const h = el('div', 'h', null, c);
    const ws = buildWords(h, [['Confirmá la'], [{ w: 'versión regional', o: true }]]);
    const pills = el('div', '', null, r); pills.style.cssText = 'position:absolute;left:72px;top:800px;display:flex;gap:18px;flex-wrap:wrap;width:936px';
    const ps = ['220–240 V', '50 Hz', 'Tomacorriente', 'Pico de arranque'].map((x, i) => el('span', 'pill' + (i < 2 ? ' o' : ''), x, pills));
    const cl = el('div', 'callout', '<div class="cap">Importante</div><p>Un modelo de <b>120 V</b> no se vuelve compatible con un adaptador mecánico. Y el pico (X-Boost, Power Lifting) <b>no es una nueva potencia nominal</b>.</p>', r); cl.style.cssText += 'left:72px;width:936px;top:960px';
    const ck = el('div', 'check', `<span class="ic">${ICON.check}</span><span>Para cargas con motor, compará con un generador<small>el pico de arranque sigue mandando</small></span>`, r); ck.style.cssText += 'position:absolute;left:72px;top:1300px;width:936px';
    R.ev(11.65, 'typing', { n: 12 }); R.ev(11.9, 'impact', { gain: .5, hi: true }); R.ev(12.15, 'impact', { gain: .9 });
    ps.forEach((_, i) => R.ev(12.5 + i * .12, 'tick')); R.ev(12.9, 'whoosh', { len: .3, soft: true }); R.ev(13.4, 'blip', { up: true });
    return { k, ws, ps, cl, ck };
  },
  frame(t, T, s) {
    typeText(s.k, 'Antes de comprar', t, .05, 36);
    wordsAnim([s.ws[0]], t, .25, 0, .8, 'rise'); wordsAnim([s.ws[1]], t, .55, 0, .55, 'slam');
    s.ps.forEach((p, i) => enter(p, t, .9 + i * .12, .6, { from: { y: 30, o: 0, s: .8 }, ease: 'outBack' }));
    enter(s.cl, t, 1.3, .8, { from: { x: -80, o: 0 } });
    enter(s.ck, t, 1.8, .7, { from: { x: 60, o: 0 } });
  }
});
addFlash(14.1, .4);

/* S5 · CTA */
scene({ t0: 14.1, t1: 17,
  build(r) {
    const logo = el('img', '', null, r); logo.src = '../../assets/logo_dark.png'; logo.style.cssText = 'position:absolute;left:50%;top:560px;width:700px;margin-left:-350px';
    const h = el('div', 'h', null, r); h.style.cssText += 'position:absolute;left:72px;right:72px;top:820px;text-align:center;font-size:84px';
    const ws = buildWords(h, [['Calculadora de'], [{ w: 'autonomía', o: true }, 'editable']]);
    const sub = el('p', 'sub', 'EcoFlow, BLUETTI y Anker comparados por capacidad, salida, química, peso y recarga, con manuales regionales.', r); sub.style.cssText += 'position:absolute;left:110px;right:110px;top:1040px;text-align:center;font-size:33px';
    const btn = el('div', 'btn', `<span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.15"><span style="font-size:22px;opacity:.85;letter-spacing:.1em">tallerlab.com.ar/generadores/</span><span>estacion-de-energia-portatil</span></span> ${ICON.arrow}`, r); btn.style.cssText += 'left:50%;top:1230px;transform-origin:center;font-size:30px;white-space:nowrap';
    const stk = el('div', 'sticker', 'todos los supuestos a la vista', r); stk.style.cssText += 'left:540px;top:1390px;transform-origin:left center';
    const ring = el('div', '', null, r); ring.style.cssText = 'position:absolute;left:50%;top:640px;border-radius:50%;border:3px solid #ff5a0a;opacity:0';
    R.ev(14.1, 'sting'); R.ev(14.55, 'impact', { gain: .5, hi: true }); R.ev(14.8, 'impact', { gain: .5, hi: true }); R.ev(15.35, 'pop'); R.ev(15.8, 'blip', { up: true });
    return { logo, ws, sub, btn, stk, ring };
  },
  frame(t, T, s) {
    const u = tw(t, 0, 1.0, 'outExpo'); st(s.logo, { s: L(1.6, 1, u), o: u, blur: (1 - u) * 20 });
    const rr = tw(t, 0, 1.4, 'outCubic'); const d = L(10, 1700, rr); s.ring.style.width = s.ring.style.height = d + 'px'; s.ring.style.margin = `${-d / 2}px 0 0 ${-d / 2}px`; s.ring.style.opacity = (1 - rr) * .9;
    wordsAnim(s.ws, t, .45, .12, .8, 'rise');
    enter(s.sub, t, .9, .8, { from: { y: 30, o: 0 } });
    const b = tw(t, 1.25, .7, 'outBack'); s.btn.style.transform = `translateX(-50%) scale(${b})`; s.btn.style.opacity = b;
    const v = tw(t, 1.7, .6, 'outBack'); st(s.stk, { o: v, r: L(10, -5, v), s: L(.7, 1, v) });
    if (t > 2) s.btn.style.transform = `translateX(-50%) scale(${1 + Math.sin((t - 2) * 7) * .025})`;
  }
});
</script></body></html>
