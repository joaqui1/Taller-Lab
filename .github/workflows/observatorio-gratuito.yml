name: Observatorio gratuito - captura y publicación

on:
  workflow_dispatch:
  schedule:
    # GitHub demora o descarta ejecuciones programadas (el 07/10 la de 07:17 corrió
    # a las 14:24 y la de 10:37 no corrió). Por eso hay varios horarios a lo largo
    # del día de Argentina, en minutos poco usados. La captura es idempotente por
    # día/modelo: una ejecución posterior solo reintenta los modelos que fallaron.
    # 00:43 ART: primera oportunidad del día.
    - cron: '43 3 * * *'
    # 04:13 ART.
    - cron: '13 7 * * *'
    # 07:17 ART (horario original).
    - cron: '17 10 * * *'
    # 10:37 y 16:37 ART.
    - cron: '37 13,19 * * *'
    # 19:23 ART: último respaldo antes de que cierre el día.
    - cron: '23 22 * * *'
  push:
    branches: [main]
    paths:
      - 'observatorio/gratuito.py'
      - 'observatorio/estatico.py'
      - 'observatorio/publication_health.py'
      - 'observatorio/piloto_gratuito.json'
      - 'observatorio/guias_por_modelo.json'
      - 'observatorio/requirements-gratuito.txt'
      - 'preparar_assets_publicos.py'
      - 'observatorio/extractors/base.py'
      - 'assets/observatorio-gratuito.*'
      - 'assets/datos/precios-observatorio.json'
      - 'tests/test_observatorio_gratuito.py'
      - 'tests/test_observatorio_publication_health.py'
      - '.github/workflows/observatorio-gratuito.yml'

concurrency:
  group: observatorio-gratuito
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    outputs:
      finished_at: ${{ steps.capture.outputs.finished_at }}
    # Nunca consumir minutos pagos de un repositorio privado.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar solo las dependencias gratuitas
        run: python -m pip install -r observatorio/requirements-gratuito.txt
      - name: Probar la captura y publicación
        run: |
          python -m unittest discover -s tests -p test_observatorio_gratuito.py -v
          python -m unittest discover -s tests -p test_observatorio_publication_health.py -v
      - name: Recuperar el historial durable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _state
          if git ls-remote --exit-code --heads origin observatorio-datos >/dev/null; then
            git fetch --no-tags origin observatorio-datos
            git show FETCH_HEAD:precios-observatorio.json > _state/precios-observatorio.json
          else
            cp assets/datos/precios-observatorio.json _state/precios-observatorio.json
          fi
      - name: Capturar y generar las páginas
        id: capture
        env:
          PYTHONUNBUFFERED: '1'
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python -m observatorio.gratuito --history _state/precios-observatorio.json --output _site --base-path "/$REPOSITORY_NAME" --site-url "https://$REPOSITORY_OWNER.github.io" --canonical-url "https://www.tallerlab.com.ar"
          python - <<'PY'
          import json, os
          with open('_site/estado.json') as source:
              report = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('finished_at=' + report['run']['finished_at'] + '\n')
          PY
      - name: Guardar solo el historial público en su rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TallerLab Observatorio'
          git config user.email 'observatorio@users.noreply.github.com'
          blob=$(git hash-object -w _state/precios-observatorio.json)
          # Esta rama solo contiene datos, no una aplicación Python desplegable.
          config=$(printf '%s\n' '{"git":{"deploymentEnabled":false}}' | git hash-object -w --stdin)
          tree=$(printf '100644 blob %s\tprecios-observatorio.json\n100644 blob %s\tvercel.json\n' "$blob" "$config" | git mktree)
          parent=$(git ls-remote --heads origin observatorio-datos | cut -f1)
          if [ -n "$parent" ]; then
            previous=$(git rev-parse "$parent^{tree}")
            if [ "$tree" = "$previous" ]; then exit 0; fi
            commit=$(printf 'Captura diaria del observatorio\n' | git commit-tree "$tree" -p "$parent")
          else
            commit=$(printf 'Historial inicial del observatorio\n' | git commit-tree "$tree")
          fi
          git push origin "$commit:refs/heads/observatorio-datos"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar la publicación (retención de un día)
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Publicar incluso los estados agotados o sin verificación
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Actualizar www.tallerlab.com.ar
        # Pages queda como copia noindex. El hook actualiza el HTML indexable de www
        # desde observatorio-datos; su ausencia es un fallo de publicación.
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta VERCEL_DEPLOY_HOOK_URL: Pages se publicó, pero el HTML indexable de www no se actualiza."
            exit 1
          fi
          curl -fsS -X POST --max-time 30 "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy de www solicitado."
      - name: Verificar el resultado publicado
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_FINISHED_AT: ${{ needs.build.outputs.finished_at }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.parse
          from observatorio.publication_health import publication_warning
          expected = os.environ['EXPECTED_FINISHED_AT']
          url = os.environ['PAGE_URL'].rstrip('/') + '/estado.json?run=' + urllib.parse.quote(expected)
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      report = json.load(response)
                  warning = publication_warning(report, expected)
                  print(json.dumps(report, ensure_ascii=False, indent=2))
                  if warning:
                      print('::warning::' + warning)
                  break
              except (ValueError, KeyError, OSError) as error:
                  if attempt == 5:
                      raise SystemExit('No se verificó la publicación actual: ' + str(error))
                  time.sleep(5)
          PY
      - name: Verificar las rutas y el historial en www
        env:
          EXPECTED_FINISHED_AT: ${{ needs.build.outputs.finished_at }}
        run: |
          python -m observatorio.publication_health --url https://www.tallerlab.com.ar --expected "$EXPECTED_FINISHED_AT" --wait-seconds 300
