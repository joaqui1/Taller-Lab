name: Verificación de producción

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tallerlab_test
          POSTGRES_PASSWORD: test_local_only
          POSTGRES_DB: tallerlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OBSERVATORY_TEST_DATABASE_URL: postgresql://tallerlab_test:test_local_only@localhost:5432/tallerlab_test
      TALLERLAB_TEST_DATABASE_URL: postgresql://tallerlab_test:test_local_only@localhost:5432/tallerlab_test
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Probar los módulos y PostgreSQL aislado
        run: |
          mkdir -p tmp
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest verificar_alertas verificar_relevamiento_seguro -v
          python verificar_tallerlab_data.py
      - name: Generar y verificar los artefactos de producción
        run: python preparar_assets_publicos.py
