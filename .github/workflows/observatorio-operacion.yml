name: Observatorio - supervision y respaldo
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: read
jobs:
  health:
    if: vars.OBSERVATORY_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m observatorio.operations complete
        env:
          SITE_URL: ${{ vars.OBSERVATORY_SITE_URL }}
          CRON_SECRET: ${{ secrets.OBSERVATORY_CRON_SECRET }}
  backup:
    if: vars.OBSERVATORY_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Respaldo cifrado
        env:
          DATABASE_URL: ${{ secrets.OBSERVATORY_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.OBSERVATORY_BACKUP_PASSPHRASE }}
        run: |
          set -eu
          test -n "$DATABASE_URL"
          test -n "$BACKUP_PASSPHRASE"
          trap 'rm -f backup.dump' EXIT
          pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --file=backup.dump
          test -s backup.dump
          pg_restore --list backup.dump > /dev/null
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output backup.dump.gpg backup.dump
      - uses: actions/upload-artifact@v7
        with:
          name: observatorio-backup-encrypted
          path: backup.dump.gpg
          retention-days: 14
          if-no-files-found: error
